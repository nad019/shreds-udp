[package]
edition = "2021"
rust-version = "1.75"
name = "shredstream"
version = "2.0.0"
authors = ["ShredStream.com"]
build = false
exclude = [
    "assets/",
    "tools/",
    "tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Solana ShredStream SDK/Decoder for Rust, enabling ultra-low latency Solana transaction streaming via UDP shreds from https://www.shredstream.com"
homepage = "https://shredstream.com"
readme = "README.md"
keywords = [
    "solana",
    "shredstream",
    "mev",
    "hft",
    "defi",
]
categories = [
    "network-programming",
    "cryptography::cryptocurrencies",
]
license = "MIT"
repository = "https://github.com/shredstream/shredstream-sdk-rust"

[lib]
name = "shredstream"
path = "src/lib.rs"

[[example]]
name = "listen"
path = "examples/listen.rs"

[[example]]
name = "pumpfun_creates"
path = "examples/pumpfun_creates.rs"

[dependencies.bincode]
version = "1.3"

[dependencies.libc]
version = "0.2"

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.socket2]
version = "0.5"
features = ["all"]

# [3.0.0 ALIGNMENT] Version 1 transactions are live in shreds; solana 3.x types cannot
# represent them and every entry carrying one dies at deserialise (decode_err, plus a
# multi-second allocator grind on the misread length prefixes). Pin the same trio the
# upstream 3.0.0 SDK pins.
[dependencies.solana-entry]
version = "=4.2.2"
features = ["agave-unstable-api"]

[dependencies.solana-transaction]
version = "=4.1.6"
features = ["serde", "wincode"]

[dependencies.wincode]
version = "=0.5.5"

[dependencies.thiserror]
version = "2"

[dev-dependencies.solana-pubkey]
version = "3.0"

[target.'cfg(not(target_arch = "x86_64"))'.dependencies.reed-solomon-erasure]
version = "6"

[target.'cfg(target_arch = "x86_64")'.dependencies.reed-solomon-erasure]
version = "6"
features = ["simd-accel"]

[dev-dependencies]
solana-hash = "3"
solana-message = "4"
solana-signature = "3"

# Test-only: real Agave shreds (data + Merkle coding) for end-to-end FEC tests.
[dev-dependencies.solana-ledger]
version = "=4.2.2"
features = ["agave-unstable-api"]

[dev-dependencies.solana-keypair]
version = "3"
